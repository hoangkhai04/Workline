<style>

@layer base {
  :root {
    --glacier-50: #f0f9ff;
    --glacier-100: #e0f2fe;
    --glacier-200: #bae6fd;
    --glacier-300: #7dd3fc;
    --glacier-400: #38bdf8;
    --glacier-500: #0ea5e9;
    --glacier-600: #0284c7;
    --glacier-700: #0369a1;
    --glacier-cyan: #06b6d4;
    --glacier-cyan-light: #22d3ee;
    --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --spring-bounce-soft: cubic-bezier(0.2, 1.25, 0.4, 1);
  }
}

/* ==========================================================================
   GLACIER THEME & LIGHT BOUNCE MICRO-INTERACTIONS
   ========================================================================== */

/* 1. Glacier Card / Box Bounce: Spring upward with ice-cyan halo */
.glacier-bounce,
.glacier-card-bounce {
  transition: transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.2s ease,
              background-color 0.2s ease;
  will-change: transform, box-shadow;
}

.glacier-bounce:hover,
.glacier-card-bounce:hover {
  transform: translateY(-3px) scale(1.012);
  box-shadow: 0 12px 28px -6px rgba(14, 165, 233, 0.22),
              0 4px 12px -2px rgba(6, 182, 212, 0.18),
              0 0 0 1px rgba(56, 189, 248, 0.25);
}

.glacier-bounce:active,
.glacier-card-bounce:active {
  transform: translateY(0px) scale(0.985);
  box-shadow: 0 4px 12px -2px rgba(14, 165, 233, 0.15);
}

/* 2. Glacier Button Bounce: Tactile spring lift on hover with glacial gradient aura */
.glacier-btn-bounce {
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
              background-color 0.2s ease,
              border-color 0.2s ease,
              filter 0.2s ease;
  will-change: transform, box-shadow;
}

.glacier-btn-bounce:hover {
  transform: translateY(-2px) scale(1.035);
  box-shadow: 0 8px 24px -4px rgba(2, 132, 199, 0.4),
              0 2px 8px -2px rgba(6, 182, 212, 0.35);
  filter: brightness(1.06);
}

.glacier-btn-bounce:active {
  transform: translateY(1px) scale(0.96);
  box-shadow: 0 2px 6px -1px rgba(2, 132, 199, 0.25);
  filter: brightness(0.95);
}

/* 3. Glacier Icon Action Bounce: Playful light bounce & rotation for round action buttons */
.glacier-icon-bounce {
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
              background-color 0.2s ease,
              color 0.2s ease,
              box-shadow 0.2s ease,
              border-color 0.2s ease;
  will-change: transform;
}

.glacier-icon-bounce:hover {
  transform: translateY(-2.5px) scale(1.16);
  box-shadow: 0 6px 16px -3px rgba(14, 165, 233, 0.3);
}

.glacier-icon-bounce:active {
  transform: translateY(0px) scale(0.92);
}

/* 4. Glacier Pill / Chip / Badge Bounce: Subtle spring bounce for filters, tags, pills */
.glacier-pill-bounce {
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
              background-color 0.2s ease,
              box-shadow 0.2s ease,
              border-color 0.2s ease,
              color 0.2s ease;
  will-change: transform;
}

.glacier-pill-bounce:hover {
  transform: translateY(-1.5px) scale(1.045);
  box-shadow: 0 4px 14px -2px rgba(56, 189, 248, 0.3);
}

.glacier-pill-bounce:active {
  transform: translateY(0px) scale(0.97);
}

/* 5. Glacier Row Bounce: Subtle lateral spring slide and ice highlight for task rows and table items */
.glacier-row-bounce {
  transition: transform 0.22s cubic-bezier(0.2, 1.25, 0.4, 1),
              box-shadow 0.2s ease,
              background-color 0.2s ease,
              border-color 0.2s ease;
  will-change: transform;
}

.glacier-row-bounce:hover {
  transform: translateX(4px) scale(1.005);
  box-shadow: 0 6px 20px -4px rgba(14, 165, 233, 0.12),
              0 0 0 1px rgba(56, 189, 248, 0.2);
}

/* 6. Glacier Gradient Backgrounds */
.bg-glacier-gradient {
  background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 45%, #06b6d4 100%);
}

.bg-glacier-frost {
  background: linear-gradient(180deg, rgba(240, 249, 255, 0.95) 0%, rgba(224, 242, 254, 0.4) 100%);
}

.dark .bg-glacier-frost {
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(8, 47, 73, 0.4) 100%);
}

/* 7. Bell Ring Animation on hover */
@keyframes glacier-bell-ring {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(16deg); }
  40% { transform: rotate(-14deg); }
  60% { transform: rotate(10deg); }
  80% { transform: rotate(-6deg); }
}

.glacier-bell:hover svg {
  animation: glacier-bell-ring 0.6s ease-in-out;
}

/* 8. Glacier Spring In / Bounce In Animation for list entrance */
@keyframes glacier-spring-in {
  0% {
    opacity: 0;
    transform: translateY(14px) scale(0.975);
  }
  65% {
    opacity: 1;
    transform: translateY(-3px) scale(1.008);
  }
  100% {
    opacity: 1;
    transform: translateY(0px) scale(1);
  }
}

const AVATAR_COLORS = [
  '#1E88E5',
  '#02A8B5',
  '#00ACC1',
  '#5C6BC0',
  '#00897B',
  '#26A69A',
  '#3949AB',
];

function colorFor(id: string): string {
  if (!id) return AVATAR_COLORS[0];
  const charCode = id.charCodeAt(id.length - 1);
  return AVATAR_COLORS[charCode % AVATAR_COLORS.length];
}

function initials(name: string): string {
  if (!name) return '—';
  const parts = name.trim().split(/\s+/);
  return parts.slice(-2).map((w) => w[0]).join('').toUpperCase();
}

function displayNameOf(m?: Member | null): string {
  if (!m) return '—';
  if (m.displayName && m.displayName.trim()) return m.displayName.trim();
  return m.name;
}

function suggestedDisplayName(fullName: string): string {
  const parts = fullName.trim().split(/\s+/).filter(Boolean);
  return parts.slice(-2).join(' ');
}

function pad2(n: number): string {
  return String(n).padStart(2, '0');
}

function todayIso(): string {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function nowIso(): string {
  const d = new Date();
  return `${todayIso()}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`;
}

function fmtDate(iso?: string): string {
  if (!iso) return '—';
  const d = new Date(iso.slice(0, 10) + 'T00:00:00');
  return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function fmtDateTime(iso?: string): string {
  if (!iso) return '—';
  const [datePart, timePart] = iso.split('T');
  const d = new Date(datePart + 'T00:00:00');
  const dateStr = d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const timeStr = timePart ? timePart.slice(0, 5) : '';
  return timeStr ? `${timeStr} ${dateStr}` : dateStr;
}

function normDeadline(v?: string): string {
  if (!v) return '';
  if (v.length === 10) return v + 'T23:59';
  return v.slice(0, 16);
}

function fmtDeadline(iso?: string): string {
  return fmtDateTime(normDeadline(iso));
}

function deadlineDate(iso?: string): Date {
  return new Date(normDeadline(iso) + ':00');
}

function isOverdue(t: Task): boolean {
  if (t.status === 'hoan_thanh') return false;
  return deadlineDate(t.deadline).getTime() < new Date().getTime();
}

function fmtDuration(ms: number): string {
  const mins = Math.max(1, Math.floor(Math.abs(ms) / 60000));
  const d = Math.floor(mins / 1440);
  const h = Math.floor((mins % 1440) / 60);
  const m = mins % 60;
  if (d > 0) return `${d} ngày${h > 0 ? ' ' + h + ' giờ' : ''}`;
  if (h > 0) return `${h} giờ${m > 0 ? ' ' + m + ' phút' : ''}`;
  return `${m} phút`;
}

function taskCode(t: Task): string {
  return t.code || `TASK-${String(t.id).replace(/\D/g, '').padStart(3, '0')}`;
}

function generateRandomPassword(len: number = 8): string {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$';
  let out = '';
  for (let i = 0; i < len; i++) {
    out += chars[Math.floor(Math.random() * chars.length)];
  }
  return out;
}

function generateMemberCode(existingMembers: Member[]): string {
  let code = '';
  do {
    code = `WL-${1000 + Math.floor(Math.random() * 9000)}`;
  } while (existingMembers.some((m) => m.code?.toLowerCase() === code.toLowerCase()));
  return code;
}

          <span className="font-extrabold text-base tracking-wide text-white group-hover:text-cyan-300 transition-colors">Workline</span>
        </button>
      </div>

          type="button"
          onClick={onToggleTheme}
          className="glacier-icon-bounce rounded-xl p-2 text-slate-300 hover:bg-sky-950/60 hover:text-cyan-300 transition-colors"
          title="Chế độ sáng/tối"
        >
          {isDark ? <Sun className="h-4 w-4 text-amber-400" /> : <Moon className="h-4 w-4 text-cyan-300" />}
        </button>

        {/* Notifications Bell */}
        <div className="relative">
          <button
            type="button"
            onClick={() => setShowBellMenu(!showBellMenu)}
            className="glacier-bell glacier-icon-bounce relative rounded-xl p-2 text-slate-300 hover:bg-sky-950/60 hover:text-cyan-300 transition-colors"
            title="Thông báo"
          >
            <Bell className="h-4 w-4" />
            {unreadCount > 0 && (
              <span className="absolute -top-1 -right-1 flex h-4 min-w-[16px] items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-bold text-white shadow-xs">
                {unreadCount}
              </span>
            )}
          </button>

          {showBellMenu && (
            <div className="absolute right-0 mt-2 w-80 sm:w-96 rounded-2xl border border-sky-100 bg-white p-4 shadow-2xl dark:border-sky-900/60 dark:bg-slate-900 text-slate-900 dark:text-white z-50">
              <div className="flex items-center justify-between pb-3 border-b border-sky-100 dark:border-slate-800">
                <span className="font-bold text-sm text-slate-900 dark:text-white">Thông báo ({notifications.length})</span>
                {notifications.length > 0 && (
                  <button
                    type="button"
                    onClick={onClearNotifications}
                    className="glacier-btn-bounce text-xs font-semibold text-sky-600 dark:text-cyan-400 hover:underline px-2 py-0.5 rounded-lg hover:bg-sky-50 dark:hover:bg-sky-950/50"
                  >
                    Xoá tất cả
                  </button>
                )}
              </div>

              <div className="max-h-80 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800 py-2">
                {notifications.map((n) => (
                  <div
                    key={n.id}
                    onClick={() => {
                      onReadNotification(n.id);
                      if (n.taskId) {
                        onSelectTask(n.taskId);
                        setShowBellMenu(false);
                      }
                    }}
                    className={`glacier-row-bounce p-3 rounded-xl cursor-pointer text-xs transition-all my-1 border ${
                      n.read 
                        ? 'border-transparent hover:bg-sky-50/70 dark:hover:bg-slate-800/60 hover:border-sky-200 dark:hover:border-sky-900' 
                        : 'border-sky-200 bg-sky-50/80 dark:border-sky-800/60 dark:bg-sky-950/40 shadow-xs'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2 mb-1">
                      <span className="font-bold text-slate-900 dark:text-white truncate">
                        {n.subject}
                      </span>
                      <span className="text-[10px] text-slate-400 shrink-0">{n.time}</span>
                    </div>
                    <p className="text-slate-600 dark:text-slate-300 line-clamp-2">{n.body}</p>
                  </div>
                ))}

                {notifications.length === 0 && (
                  <div className="py-8 text-center text-xs text-slate-400">
                    Chưa có thông báo nào.
                  </div>
                )}
              </div>
            </div>
          )}
        </div>

        {/* User preview -> goes straight to profile/settings */}
        <div className="relative">
          <button
            type="button"
            onClick={onOpenProfile}
            className="glacier-pill-bounce flex items-center gap-2 cursor-pointer rounded-xl py-1 px-2 hover:bg-sky-950/50 border border-transparent hover:border-sky-800/50 transition-colors"
            title="Xem hồ sơ"
          >
            <div
              className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full font-bold text-white text-xs ring-2 ring-sky-400/40 overflow-hidden shadow-xs"
              style={{ backgroundColor: colorFor(currentUser.id) }}
            >
              {currentUser.avatarUrl ? (
                <img src={currentUser.avatarUrl} alt="" className="h-full w-full rounded-full object-cover" />
              ) : (
                initials(displayNameOf(currentUser))
              )}
            </div>
            <div className="hidden sm:block text-left leading-tight">
              <div className="text-xs font-bold text-white flex items-center gap-1">
                <span>{displayNameOf(currentUser)}</span>
              </div>
              <div className={`text-[10px] font-bold ${
                currentUser.role === 'admin' 
                  ? 'text-purple-300' 
                  : currentUser.role === 'leader' 
                  ? 'text-cyan-400' 
                  : 'text-amber-300'
              }`}>
                {currentUser.role === 'admin' ? '🛡️ Admin' : currentUser.role === 'leader' ? '👑 Leader' : 'Thành viên'}
              </div>
            </div>
          </button>
        </div>

        {/* Logout button */}
        <button
          type="button"
          onClick={onLogout}
          className="glacier-btn-bounce inline-flex items-center gap-1.5 rounded-xl bg-rose-500/20 px-3 py-1.5 text-xs font-bold text-rose-300 hover:bg-rose-500/30 hover:text-white transition-colors cursor-pointer"
        >
          <LogOut className="h-3.5 w-3.5" />
          <span className="hidden sm:inline">Thoát</span>
        </button>
      </div>
    </header>
  );
};

  allMembers,
  onOpenTaskDetail,
  onOpenNewTask,
  onAcceptTask,
  onCompleteTask,
  onDeleteCompletedTask,
  onDeleteExtensionHistory,
  onClearAllExtensionHistory,
  onOpenProfile,
  onOpenExtendModal,
  onApproveExtension,
  onRejectExtension,
  onViewQuickProfile,
}) => {
  const [activeTab, setActiveTab] = useState<TabKey>('cho_nhan');
  const [bounceKey, setBounceKey] = useState(0);
  const taskListRef = useRef<HTMLDivElement>(null);
  const [activePopup, setActivePopup] = useState<PopupType>(null);
  const [extensionSubTab, setExtensionSubTab] = useState<'pending' | 'history'>('pending');
  const [historyMemberFilter, setHistoryMemberFilter] = useState<string>('all');
  const [rejectingReqId, setRejectingReqId] = useState<string | null>(null);
  const [rejectNote, setRejectNote] = useState('');

  const handleSelectTab = (tab: TabKey) => {
    setActiveTab(tab);
    setBounceKey((k) => k + 1);
    setTimeout(() => {
      taskListRef.current?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 40);
  };

  const isLeader = currentUser.role === 'leader' || currentUser.role === 'admin';
  const isAdmin = currentUser.role === 'admin';

  // Task filtering per tab (loại trừ các task đã bị cá nhân người dùng xoá)
  const isHiddenForMe = (t: Task) => (t.deletedForUsers || []).includes(currentUser.id);

  const canAccept = (t: Task) =>
    t.status !== 'hoan_thanh' &&
    !t.acceptedBy.includes(currentUser.id) &&
    (t.assignees.includes(currentUser.id) || t.type === 'chung');

  // Mục "Cần nhận việc": TẤT CẢ thành viên đều thấy các task đang chờ nhận,
  // kể cả khi không phải người được tag. Quyền bấm "Nhận việc" vẫn do canAccept() quyết định
  // (chỉ assignees hoặc task loại "chung" mới bấm được) — xem canAcc / canAccept(t) bên dưới.
  const tasksToReceive = tasks.filter((t) => !isHiddenForMe(t) && t.status === 'cho_nhan');
  // Số việc THỰC SỰ dành cho người dùng hiện tại (được tag / hoặc việc chung) - dùng cho câu chào & số liệu cá nhân,
  // khác với tasksToReceive (danh sách hiển thị cho tất cả mọi người xem).
  const myAcceptableCount = tasks.filter((t) => !isHiddenForMe(t) && canAccept(t)).length;
  const tasksInProgress = tasks.filter((t) => !isHiddenForMe(t) && t.status === 'dang_xu_ly');
  const myTasks = tasks.filter((t) => !isHiddenForMe(t) && t.status !== 'hoan_thanh' && t.acceptedBy.includes(currentUser.id));
  const completedTasks = tasks.filter((t) => !isHiddenForMe(t) && t.status === 'hoan_thanh');

  const overdueTasks = tasks.filter((t) => {
    if (t.status === 'hoan_thanh' || isHiddenForMe(t)) return false;
    const isMine = t.assignees.includes(currentUser.id);
    return (isLeader || isMine) && isOverdue(t);
  });
  // Việc Quá hạn hiển thị theo dạng cũ nhất (xếp thời gian ngày tháng năm tăng dần)
  overdueTasks.sort((a, b) => new Date(a.deadline).getTime() - new Date(b.deadline).getTime());

  // Extract all extension requests
  const allExtensionRequests: FlatExtensionItem[] = [];
  tasks.forEach((t) => {
    (t.extensionRequests || []).forEach((req) => {
      const requester = allMembers.find((m) => m.id === req.requesterId);
      if (isLeader || req.requesterId === currentUser.id) {
        allExtensionRequests.push({ request: req, task: t, requester });
      }
    });
  });

  // Yêu cầu gia hạn hiển thị theo dạng cũ nhất (xếp thời gian ngày tháng năm tăng dần)
  allExtensionRequests.sort((a, b) => new Date(a.request.createdAt).getTime() - new Date(b.request.createdAt).getTime());

  const pendingExtensions = allExtensionRequests.filter((item) => item.request.status === 'pending');
  
  // Lịch sử gia hạn đã xử lý (loại trừ mục đã bị người dùng này xoá, và hỗ trợ lọc theo từng người)
  const historyExtensions = allExtensionRequests.filter((item) => {
    if (item.request.status === 'pending') return false;
    if ((item.request.deletedForUsers || []).includes(currentUser.id)) return false;
    if (historyMemberFilter !== 'all' && item.requester?.id !== historyMemberFilter) return false;
    return true;
  });

  // Violations list
  const allViolations: FlatViolationItem[] = [];
  if (isLeader) {
    allMembers.forEach((m) => {
      (m.violations || []).forEach((v) => {
        allViolations.push({ violation: v, member: m });
      });
    });
  } else {
    (currentUser.violations || []).forEach((v) => {
      allViolations.push({ violation: v, member: currentUser });
    });
  }
  const myViolationsCount = (currentUser.violations || []).length;

  let currentList: Task[] = [];
  if (activeTab === 'cho_nhan') currentList = tasksToReceive;
  else if (activeTab === 'dang_xu_ly') currentList = tasksInProgress;
  else if (activeTab === 'cua_toi') currentList = myTasks;
  else currentList = completedTasks;

  const handleConfirmReject = (taskId: string, reqId: string) => {
    if (onRejectExtension) {
      onRejectExtension(taskId, reqId, rejectNote.trim());
    }
    setRejectingReqId(null);
    setRejectNote('');
  };

  return (
    <div className="space-y-6">
      {/* Greeting row */}
      <div className="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h1 className="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
            Xin chào, {displayNameOf(currentUser)} 👋
          </h1>
          <p className="text-sm text-slate-500 dark:text-slate-400">
            Hôm nay bạn có {myAcceptableCount} công việc cần nhận và {myTasks.length} việc đang thực hiện.
            {isLeader && pendingExtensions.length > 0 && (
              <span className="ml-1 text-amber-600 dark:text-amber-400 font-semibold">
                • {pendingExtensions.length} yêu cầu gia hạn đang chờ bạn duyệt!
              </span>
            )}
          </p>
        </div>
        <button
          type="button"
          onClick={onOpenNewTask}
          className="glacier-btn-bounce inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-sky-600 via-blue-600 to-cyan-500 px-4 py-2.5 text-sm font-bold text-white shadow-md shadow-sky-900/20 hover:shadow-cyan-500/30 transition-all shrink-0 cursor-pointer"
        >
          <Plus className="h-4 w-4" />
          Giao Task Mới
        </button>
      </div>

      {/* Stats Cards */}
      <div className="grid grid-cols-2 gap-3 sm:grid-cols-2 lg:grid-cols-4">
        {/* Card 1: Can nhan */}
        <div
          onClick={() => handleSelectTab('cho_nhan')}
          className="glacier-card-bounce cursor-pointer rounded-2xl border border-sky-100/90 bg-white p-4 shadow-xs hover:border-sky-400 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-sky-600 transition-all group"
        >
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-slate-600 dark:text-slate-300">Cần nhận việc</span>
            <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-sky-100 text-sky-600 dark:bg-sky-950 dark:text-cyan-400 group-hover:scale-110 transition-transform">
              <FileText className="h-4 w-4" />
            </div>
          </div>
          <div className="mt-2 text-2xl font-black text-slate-900 dark:text-white">
            {tasksToReceive.length}
          </div>
        </div>

        {/* Card 2: Dang xu ly */}
        <div
          onClick={() => handleSelectTab('dang_xu_ly')}
          className="glacier-card-bounce cursor-pointer rounded-2xl border border-slate-200/80 bg-white p-4 shadow-xs hover:border-amber-400 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-amber-600 transition-all group"
        >
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-slate-600 dark:text-slate-300">Đang xử lý</span>
            <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-amber-50 text-amber-600 dark:bg-amber-950 dark:text-amber-400 group-hover:scale-110 transition-transform">
              <Clock className="h-4 w-4" />
            </div>
          </div>
          <div className="mt-2 text-2xl font-black text-slate-900 dark:text-white">
            {tasksInProgress.length}
          </div>
        </div>

        {/* Card 3: Yeu cau gia han (CHÍNH CHO LEADER & MEMBER) */}
        <div
          onClick={() => {
            setExtensionSubTab('pending');
            setActivePopup('gia_han');
          }}
          className={`glacier-card-bounce cursor-pointer rounded-2xl border p-4 shadow-xs transition-all group ${
            pendingExtensions.length > 0
              ? 'border-amber-300 bg-gradient-to-br from-amber-50/70 via-white to-sky-50/40 dark:from-amber-950/30 dark:via-slate-900 dark:to-slate-900 dark:border-amber-600/70'
              : 'border-slate-200/80 bg-white hover:border-sky-300 dark:border-slate-800 dark:bg-slate-900'
          }`}
        >
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-slate-700 dark:text-slate-200">
              Yêu cầu gia hạn
            </span>
            <div className={`flex h-8 w-8 items-center justify-center rounded-lg ${
              pendingExtensions.length > 0
                ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/60 dark:text-amber-300'
                : 'bg-sky-50 text-sky-600 dark:bg-slate-800 dark:text-cyan-400'
            } group-hover:scale-110 transition-transform`}>
              <CalendarClock className="h-4 w-4" />
            </div>
          </div>
          <div className="mt-2 flex items-baseline gap-2">
            <span className={`text-2xl font-black ${pendingExtensions.length > 0 ? 'text-amber-600 dark:text-amber-400' : 'text-slate-900 dark:text-white'}`}>
              {pendingExtensions.length}
            </span>
            {pendingExtensions.length > 0 && (
              <span className="rounded-full bg-amber-100 px-2 py-0.5 text-[10px] font-bold text-amber-700 dark:bg-amber-950 dark:text-amber-300 animate-pulse">
                Chờ duyệt
              </span>
            )}
          </div>
          <div className="mt-1 flex items-center justify-between">
            <span className="text-[11px] text-amber-600 dark:text-amber-400 font-semibold flex items-center gap-0.5">
              Xem <ArrowRight className="h-3 w-3 inline" />
            </span>
          </div>
        </div>

        {/* Card 4: Qua han */}
        <div
          onClick={() => setActivePopup('qua_han')}
          className="glacier-card-bounce cursor-pointer rounded-2xl border border-slate-200/80 bg-white p-4 shadow-xs hover:border-rose-400 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-rose-600 transition-all group"
        >
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-slate-600 dark:text-slate-300">Việc quá hạn</span>
            <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-rose-50 text-rose-600 dark:bg-rose-950 dark:text-rose-400 group-hover:scale-110 transition-transform">
              <AlertCircle className="h-4 w-4" />
            </div>
          </div>
          <div className={`mt-2 text-2xl font-black ${overdueTasks.length > 0 ? 'text-rose-600' : 'text-slate-900 dark:text-white'}`}>
            {overdueTasks.length}
          </div>
          <div className="mt-1 flex items-center justify-between">
            <span className="text-[11px] text-rose-600 dark:text-rose-400 font-semibold flex items-center gap-0.5">
              Xem <ArrowRight className="h-3 w-3 inline" />
            </span>
          </div>
        </div>
      </div>

      {/* Main Task List Panel */}
      <div ref={taskListRef} className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs dark:border-slate-800 dark:bg-slate-900 scroll-mt-20">
        <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800 mb-4">
          <h2 className="text-base font-bold text-slate-900 dark:text-white">
            Điều phối công việc
          </h2>
          <span className="text-xs text-slate-400">
            Bấm vào từng công việc để xem chi tiết và thảo luận tiến độ
          </span>
        </div>

        {/* Tabs */}
        <div className="flex gap-2 border-b border-slate-100 dark:border-slate-800 mb-6 overflow-x-auto pb-1">
          {[
            { key: 'cho_nhan', label: 'Cần nhận việc', count: tasksToReceive.length },
            { key: 'dang_xu_ly', label: 'Đang xử lý', count: tasksInProgress.length },
            { key: 'cua_toi', label: 'Việc của tôi', count: myTasks.length },
            { key: 'hoan_thanh', label: 'Đã hoàn thành', count: completedTasks.length },
          ].map((tab) => (
            <button
              key={tab.key}
              type="button"
              onClick={() => handleSelectTab(tab.key as TabKey)}
              className={`glacier-pill-bounce flex items-center gap-2 border-b-2 py-2.5 px-3.5 text-sm font-bold whitespace-nowrap rounded-t-xl transition-all cursor-pointer ${
                activeTab === tab.key
                  ? 'border-sky-500 text-sky-600 dark:text-cyan-400 bg-sky-50/50 dark:bg-sky-950/20'
                  : 'border-transparent text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800/40'
              }`}
            >
              {tab.label}
              <span className={`rounded-full px-2 py-0.5 text-xs font-bold ${
                activeTab === tab.key
                  ? 'bg-sky-100 text-sky-700 dark:bg-sky-900 dark:text-cyan-200'
                  : 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400'
              }`}>
                {tab.count}
              </span>
            </button>
          ))}
        </div>

        {/* Task Items */}
        <div key={`${activeTab}-${bounceKey}`} className="space-y-3">
          {currentList.map((t, index) => {
            const overdue = isOverdue(t);
            const creator = allMembers.find((m) => m.id === t.creator);
            const canAcc = canAccept(t);
            const canDone = t.status !== 'hoan_thanh' && (isLeader || t.acceptedBy.includes(currentUser.id));
            const hasPendingExtension = (t.extensionRequests || []).some((r) => r.status === 'pending');
            const isCompleted = t.status === 'hoan_thanh';
            const assigneeMembers = t.assignees
              .map((aid) => allMembers.find((m) => m.id === aid))
              .filter(Boolean) as Member[];

            return (
              <div
                key={t.id}
                style={{
                  animationDelay: `${Math.min(index * 40, 360)}ms`,
                  animationFillMode: 'both'
                }}
                className="glacier-bounce-item"
              >
              <div
                className="glacier-task-hover-bounce flex flex-col gap-3 py-3.5 px-4 sm:flex-row sm:items-center sm:justify-between rounded-2xl border border-slate-200/80 bg-white dark:border-slate-800/80 dark:bg-slate-900/90 shadow-2xs hover:border-sky-300 dark:hover:border-sky-700/60"
              >
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-mono text-xs font-semibold text-slate-400">
                      {taskCode(t)}
                    </span>
                    <h3
                      onClick={() => onOpenTaskDetail(t.id)}
                      className="font-bold text-slate-900 hover:text-sky-600 dark:text-white dark:hover:text-cyan-400 cursor-pointer text-sm truncate"
                    >
                      {t.title}
                    </h3>
                    {isCompleted && (
                      <span className="rounded-md bg-teal-100 px-2 py-0.5 text-[11px] font-bold text-teal-800 dark:bg-teal-950 dark:text-teal-300 flex items-center gap-1">
                        <Check className="h-3 w-3" /> Đã hoàn thành
                      </span>
                    )}
                    {overdue && (
                      <span className="rounded-md bg-rose-100 px-2 py-0.5 text-[11px] font-bold text-rose-700 dark:bg-rose-950 dark:text-rose-400">
                        Quá hạn
                      </span>
                    )}
                    {hasPendingExtension && (
                      <span className="rounded-md bg-amber-100 px-2 py-0.5 text-[11px] font-bold text-amber-800 dark:bg-amber-950 dark:text-amber-300 flex items-center gap-1">
                        <CalendarClock className="h-3 w-3" /> Xin gia hạn
                      </span>
                    )}
                  </div>

                  <div className="flex flex-wrap items-center gap-2 mt-2 text-xs text-slate-500 dark:text-slate-400">
                    {creator && (
                      <button
                        type="button"
                        onClick={(e) => {
                          e.stopPropagation();
                          onViewQuickProfile?.(creator);
                        }}
                        className="glacier-pill-bounce inline-flex items-center gap-1 rounded bg-slate-100 px-2 py-0.5 dark:bg-slate-800 hover:bg-sky-100 hover:text-sky-700 dark:hover:bg-slate-700 dark:hover:text-cyan-300 transition-colors cursor-pointer"
                        title={`Xem thông tin của ${displayNameOf(creator)}`}
                      >
                        <span>Giao bởi:</span>{' '}
                        <b className="text-slate-700 dark:text-slate-300 underline decoration-slate-300">{displayNameOf(creator)}</b>
                      </button>
                    )}
                    {t.targetAudience && (
                      <span className="rounded bg-slate-100 px-2 py-0.5 dark:bg-slate-800">
                        Đối tượng: <b>{t.targetAudience}</b>
                      </span>
                    )}
                    <span className={`rounded px-2 py-0.5 font-semibold ${
                      overdue ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-400' : 'bg-slate-100 dark:bg-slate-800'
                    }`}>
                      Hạn: {fmtDeadline(t.deadline)}
                    </span>
                    {overdue && (
                      <span className="text-rose-600 font-bold">Quá hạn</span>
                    )}
                  </div>

                  {/* Danh sách người nhận việc / thực hiện - bấm để xem nhanh popup thông tin cơ bản */}
                  {assigneeMembers.length > 0 && (
                    <div className="flex flex-wrap items-center gap-1.5 mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-800/60">
                      <span className="text-[11px] font-semibold text-slate-400">Người thực hiện:</span>
                      <div className="flex flex-wrap items-center gap-1.5">
                        {assigneeMembers.map((m) => {
                          const accepted = t.acceptedBy.includes(m.id);
                          return (
                            <button
                              key={m.id}
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                onViewQuickProfile?.(m);
                              }}
                              className="glacier-pill-bounce inline-flex items-center gap-1.5 rounded-full bg-slate-100/90 pl-1 pr-2.5 py-0.5 text-xs text-slate-700 hover:bg-sky-100 hover:text-sky-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-cyan-300 transition-colors cursor-pointer shadow-2xs border border-slate-200/60 dark:border-slate-700/60"
                              title={`Xem thông tin của ${displayNameOf(m)}`}
                            >
                              <span
                                className="flex h-4.5 w-4.5 shrink-0 items-center justify-center rounded-full text-[9px] font-bold text-white overflow-hidden"
                                style={{ backgroundColor: m.avatarUrl ? undefined : colorFor(m.id) }}
                              >
                                {m.avatarUrl ? (
                                  <img src={m.avatarUrl} alt="" className="h-full w-full object-cover" />
                                ) : (
                                  initials(displayNameOf(m))
                                )}
                              </span>
                              <span className="font-semibold text-[11px]">{displayNameOf(m)}</span>
                              {accepted && (
                                <span className="text-[10px] text-teal-600 font-bold" title="Đã nhận việc">✓</span>
                              )}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>

                <div className="flex items-center gap-2 shrink-0">
                  <button
                    type="button"
                    onClick={() => onOpenTaskDetail(t.id)}
                    className="glacier-btn-bounce rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-50 hover:border-sky-300 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 cursor-pointer"
                  >
                    Xem chi tiết
                  </button>

                  {canAcc && (
                    <button
                      type="button"
                      onClick={() => onAcceptTask(t.id)}
                      className="glacier-btn-bounce rounded-xl bg-gradient-to-r from-sky-600 to-cyan-600 hover:from-sky-500 hover:to-cyan-500 px-3.5 py-1.5 text-xs font-bold text-white shadow-xs cursor-pointer"
                    >
                      Nhận việc
                    </button>
                  )}

                  {canDone && (
                    <button
                      type="button"
                      onClick={() => onCompleteTask(t.id)}
                      className="glacier-btn-bounce rounded-xl bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 px-3.5 py-1.5 text-xs font-bold text-white shadow-xs cursor-pointer"
                    >
                      Hoàn thành
                    </button>
                  )}

                  {isCompleted && onDeleteCompletedTask && (
                    <button
                      type="button"
                      onClick={() => onDeleteCompletedTask(t.id)}
                      className="glacier-btn-bounce inline-flex items-center gap-1.5 rounded-xl border border-rose-200 bg-rose-50 px-3 py-1.5 text-xs font-bold text-rose-700 hover:bg-rose-100 hover:border-rose-300 dark:border-rose-900/60 dark:bg-rose-950/40 dark:text-rose-300 cursor-pointer transition-colors shadow-2xs"
                      title="Xoá nhiệm vụ hoàn thành này khỏi danh sách của bạn (các thành viên khác vẫn giữ nguyên)"
                    >
                      <Trash2 className="h-3.5 w-3.5" />
                      Xoá
                    </button>
                  )}

                  {overdue && t.status !== 'hoan_thanh' && (
                    <button
                      type="button"
                      onClick={() => onOpenExtendModal(t.id)}
                      className="glacier-btn-bounce rounded-xl border border-amber-300 bg-amber-50 px-3 py-1.5 text-xs font-bold text-amber-800 hover:bg-amber-100 dark:border-amber-800 dark:bg-amber-950/60 dark:text-amber-300 cursor-pointer"
                    >
                      {isLeader ? 'Gia hạn' : 'Xin gia hạn'}
                    </button>
                  )}
                </div>
              </div>
              </div>
            );
          })}

          {currentList.length === 0 && (
            <div className="py-12 text-center text-sm text-slate-400">
              Không có công việc nào trong mục này.
            </div>
          )}
        </div>
      </div>

      {/* ========================================================================= */}
      {/* POPUP MODALS SYSTEM FOR ALL CARDS */}
      {/* ========================================================================= */}
      {activePopup && ReactDOM.createPortal(
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-3 sm:p-4 backdrop-blur-md">

                          <button
                            type="button"
                            onClick={() => {
                              setActivePopup(null);
                              onOpenTaskDetail(t.id);

                          >
                            Chi tiết
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}

                  {overdueTasks.length === 0 && (
                    <div className="py-12 text-center text-sm text-slate-400">
                      Tuyệt vời! Không có công việc nào bị quá hạn 🎉
                    </div>
                  )}
                </div>
              )}

              {/* ---------------- 5. POPUP VI PHẠM ---------------- */}
              {activePopup === 'vi_pham' && (
                <div className="space-y-3">
                  {allViolations.map(({ violation, member }) => (
                    <div

                      className="rounded-xl border border-rose-100 bg-rose-50/30 p-3.5 dark:border-rose-900/60 dark:bg-slate-700/40 space-y-1.5 text-xs"

                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <div
                            className="flex h-6 w-6 items-center justify-center rounded-full font-bold text-white text-[10px]"

                          >
                            {initials(displayNameOf(member))}
                          </div>
                          <span className="font-bold text-slate-900 dark:text-white">
                            {displayNameOf(member)}
                          </span>
                          <span className="text-slate-400 font-mono text-[11px]">

                        </div>
                        <span className="text-rose-600 font-semibold text-[11px]">
                          {fmtDate(violation.date)}

                      <div className="text-slate-700 dark:text-slate-300 pl-8">

                        {violation.note}
                      </div>

                      {violation.taskId && (
                        <div className="pl-8 pt-1">
                          <button
                            type="button"
                            onClick={() => {
                              setActivePopup(null);
                              onOpenTaskDetail(violation.taskId!);
                            }}
                            className="text-sky-600 hover:underline inline-flex items-center gap-1 font-semibold"
                          >
                            <ExternalLink className="h-3 w-3" /> Xem task liên quan
                          </button>
                        </div>
                      )}
                    </div>
                  ))}

                  {allViolations.length === 0 && (
                    <div className="py-12 text-center text-sm text-slate-400">
                      Không có ghi nhận vi phạm nào 🎉
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* POPUP FOOTER */}
            <div className="flex items-center justify-end px-6 py-3 border-t border-sky-100/60 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/80">

              >
                Đóng
              </button>
            </div>
          </div>
        </div>,
        document.body
      )}
    </div>
  );
};

  onAddMember: () => void;
  onDeleteMember: (id: string) => void;
  onViewQuickProfile: (member: Member) => void;
  onResendInvite?: (member: Member) => Promise<void> | void;
}

  members,
  tasks,
  currentUser,
  onEditMember,
  onAddMember,
  onDeleteMember,
  onViewQuickProfile,

}) => {

  const [roleFilter, setRoleFilter] = useState<'all' | 'admin' | 'leader' | 'member'>('all');
  const [teamFilter, setTeamFilter] = useState('all');
  const [confirmDeleteId, setConfirmDeleteId] = useState<string | null>(null);
  const [confirmResendId, setConfirmResendId] = useState<string | null>(null);
  const [resendingId, setResendingId] = useState<string | null>(null);
  const [showViolatorsPopup, setShowViolatorsPopup] = useState(false);

  const isAdmin = currentUser.role === 'admin';
  const isLeader = currentUser.role === 'leader';
  const isAdminOrLeader = isAdmin || isLeader;

  // Teams list
  const uniqueTeams = Array.from(new Set(members.map((m) => m.team).filter(Boolean))).sort();

  // Filtered members
  const filtered = members.filter((m) => {
    const q = searchQuery.toLowerCase().trim();
    const matchesQ =
      !q ||
      m.name.toLowerCase().includes(q) ||
      (m.displayName && m.displayName.toLowerCase().includes(q)) ||
      m.email.toLowerCase().includes(q) ||
      (m.code && m.code.toLowerCase().includes(q)) ||
      (m.phone && m.phone.includes(q)) ||
      (m.team && m.team.toLowerCase().includes(q));

    const matchesRole = roleFilter === 'all' || m.role === roleFilter;
    const matchesTeam = teamFilter === 'all' || m.team === teamFilter;

    return matchesQ && matchesRole && matchesTeam;
  });

  const admins = filtered.filter((m) => m.role === 'admin');
  const leaders = filtered.filter((m) => m.role === 'leader');
  const teamMembers = filtered.filter((m) => m.role === 'member');

  const totalCount = members.length;
  const adminCount = members.filter((m) => m.role === 'admin').length;
  const leaderCount = members.filter((m) => m.role === 'leader').length;
  const memberCount = members.filter((m) => m.role === 'member').length;
  const violationCount = members.filter((m) => m.violations && m.violations.length > 0).length;
  const violators = members
    .filter((m) => m.violations && m.violations.length > 0)
    .sort((a, b) => (b.violations?.length || 0) - (a.violations?.length || 0));

            Danh sách nhân sự
          </h1>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">
            {isAdmin 
              ? 'Tài khoản Quản trị viên (Admin) toàn quyền: kiểm soát hệ thống, thay đổi vai trò Leader và nhân sự.'
              : 'Quản lý nhân sự, phân công xử lý công việc và cập nhật hồ sơ thành viên.'}
          </p>
        </div>
        {isAdminOrLeader && (
          <button
            type="button"
            onClick={onAddMember}
            className="glacier-btn-bounce inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-sky-600 via-blue-600 to-cyan-500 px-4 py-2.5 text-sm font-bold text-white shadow-md shadow-sky-900/20 hover:shadow-cyan-500/30 transition-all shrink-0 cursor-pointer"
          >
            <Plus className="h-4 w-4" />
            Thêm nhân sự mới
          </button>
        )}
      </div>

      {/* Summary Cards */}
      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">

          <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-sky-100 text-sky-600 dark:bg-sky-950/60 dark:text-cyan-400">
            <Users className="h-5 w-5" />
          </div>
          <div>
            <div className="text-xl font-black text-slate-900 dark:text-white">{totalCount}</div>
            <div className="text-xs font-semibold text-slate-500 dark:text-slate-400">Tổng nhân sự</div>
          </div>

        <div className="glacier-card-bounce flex items-center gap-3 rounded-2xl border border-slate-200/80 bg-white p-4 shadow-xs dark:border-slate-800 dark:bg-slate-900 hover:border-purple-300 dark:hover:border-purple-700 transition-all cursor-default">

        {/* Violations */}
        <td className="py-3 px-4 text-center">

            <span className="text-xs text-slate-300 dark:text-slate-600">—</span>

  }

interface ProfileViewProps {
  currentUser: Member;
  isDark?: boolean;
  onToggleTheme?: (specificTheme?: 'light' | 'dark') => void;
  onUpdateProfile: (updated: Partial<Member>) => void;
  onShowToast: (type: 'success' | 'error' | 'info', message: string) => void;
}

const ProfileView: React.FC<ProfileViewProps> = ({
  currentUser,
  isDark,
  onToggleTheme,
  onUpdateProfile,
  onShowToast,
}) => {
  // Profile edit fields
  const [name, setName] = useState(currentUser.name);
  const [displayName, setDisplayName] = useState(currentUser.displayName || suggestedDisplayName(currentUser.name));
  const [phone, setPhone] = useState(currentUser.phone || '');
  const [avatarUrl, setAvatarUrl] = useState<string | undefined>(currentUser.avatarUrl);

  // Password fields
  const [currentPass, setCurrentPass] = useState('');
  const [newPass, setNewPass] = useState('');
  const [confirmPass, setConfirmPass] = useState('');
  const [showCurrent, setShowCurrent] = useState(false);
  const [showNew, setShowNew] = useState(false);
  const [showConfirm, setShowConfirm] = useState(false);

  // Push notifications
  const [pushEnabled, setPushEnabled] = useState(Boolean(currentUser.pushEnabled));

  useEffect(() => {
    setName(currentUser.name);
    setDisplayName(currentUser.displayName || suggestedDisplayName(currentUser.name));
    setPhone(currentUser.phone || '');
    setAvatarUrl(currentUser.avatarUrl);
    setPushEnabled(Boolean(currentUser.pushEnabled));
  }, [currentUser]);

  const handleAvatarChange = (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      onShowToast('error', 'Vui lòng chọn tệp hình ảnh hợp lệ.');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      setAvatarUrl(reader.result as string);
      onShowToast('info', 'Đã tải ảnh lên. Nhớ bấm "Lưu thay đổi" để hoàn tất.');
    };
    reader.readAsDataURL(file);
  };

  const handleSaveProfile = (e: React.FormEvent) => {
    e.preventDefault();
    if (!name.trim()) {
      onShowToast('error', 'Họ và tên không được để trống.');
      return;
    }
    onUpdateProfile({
      name: name.trim(),
      displayName: displayName.trim() || suggestedDisplayName(name.trim()),
      phone: phone.trim(),
      avatarUrl,
    });
    onShowToast('success', 'Đã lưu thay đổi hồ sơ cá nhân thành công.');
  };

  const handleChangePassword = (e: React.FormEvent) => {
    e.preventDefault();
    if (!currentPass) {
      onShowToast('error', 'Vui lòng nhập mật khẩu hiện tại.');
      return;
    }
    if (currentPass !== (currentUser.password || '123')) {
      onShowToast('error', 'Mật khẩu hiện tại không chính xác.');
      return;
    }
    if (!newPass || newPass.length < 4) {
      onShowToast('error', 'Mật khẩu mới phải có tối thiểu 4 ký tự.');
      return;
    }
    if (newPass !== confirmPass) {
      onShowToast('error', 'Mật khẩu xác nhận không khớp.');
      return;
    }

    onUpdateProfile({ password: newPass });
    setCurrentPass('');
    setNewPass('');
    setConfirmPass('');
    onShowToast('success', 'Đã thay đổi mật khẩu thành công.');
  };

  const handleTogglePush = () => {
    if (!pushEnabled) {
      if (!('Notification' in window)) {
        onShowToast('error', 'Trình duyệt không hỗ trợ thông báo đẩy.');
        return;
      }
      Notification.requestPermission().then((perm) => {
        if (perm === 'granted') {
          setPushEnabled(true);
          onUpdateProfile({ pushEnabled: true });
          onShowToast('success', 'Đã bật thông báo đẩy thành công.');
        } else {
          onShowToast('error', 'Bạn đã chặn quyền thông báo của trình duyệt.');
        }
      });
    } else {
      setPushEnabled(false);
      onUpdateProfile({ pushEnabled: false });

interface TaskDetailViewProps {
  task: Task;
  allMembers: Member[];
  currentUser: Member;
  onBack: () => void;
  onAccept: (taskId: string) => void;
  onComplete: (taskId: string) => void;
  onReopen: (taskId: string) => void;
  onDelete: (taskId: string) => void;
  onDeleteCompletedTask?: (taskId: string) => void;
  onAddComment: (taskId: string, text: string, isProgress?: boolean) => void;
  onAddAssignee: (taskId: string, memberId: string) => void;
  onRemoveAssignee: (taskId: string, memberId: string) => void;
  onRequestExtend: (taskId: string) => void;
  onViewQuickProfile?: (member: Member) => void;
}

const TaskDetailView: React.FC<TaskDetailViewProps> = ({
  task,
  allMembers,
  currentUser,
  onBack,
  onAccept,
  onComplete,
  onReopen,
  onDelete,
  onDeleteCompletedTask,
  onAddComment,
  onAddAssignee,
  onRemoveAssignee,
  onRequestExtend,
  onViewQuickProfile,
}) => {
  const [commentText, setCommentText] = useState('');
  const [progressText, setProgressText] = useState('');
  const [selectedNewAssignee, setSelectedNewAssignee] = useState('');
  const [newAssigneeQuery, setNewAssigneeQuery] = useState('');
  const [showAssigneeSuggestions, setShowAssigneeSuggestions] = useState(false);

  const creator = allMembers.find((m) => m.id === task.creator);
  const isLeader = currentUser.role === 'leader' || currentUser.role === 'admin';
  const isCreator = task.creator === currentUser.id;
  const isAssignee = task.assignees.includes(currentUser.id);
  const hasAccepted = task.acceptedBy.includes(currentUser.id);
  const overdue = isOverdue(task);
  const canAccept = task.status !== 'hoan_thanh' && !hasAccepted && (isAssignee || task.type === 'chung');
  const canComplete = task.status !== 'hoan_thanh' && (isLeader || hasAccepted);
  const unassignedMembers = allMembers.filter((m) => !task.assignees.includes(m.id));
  const filteredAssigneeSuggestions = newAssigneeQuery.trim()
    ? unassignedMembers.filter((m) =>
        displayNameOf(m).toLowerCase().includes(newAssigneeQuery.trim().toLowerCase())
      )
    : unassignedMembers;

  const handleSelectAssigneeSuggestion = (m: Member) => {
    setSelectedNewAssignee(m.id);
    setNewAssigneeQuery(displayNameOf(m));
    setShowAssigneeSuggestions(false);
  };

  const handleAddAssigneeClick = () => {

          <form onSubmit={handleSendProgress} className="space-y-3">

              rows={2}

              className="rounded-xl bg-slate-900 px-4 py-2 text-xs font-bold text-white hover:bg-slate-800 dark:bg-blue-600"
            >
              Cập nhật tiến độ
            </button>
          </form>
        </div>
      )}

      {/* Comments & History Thread */}
      <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-xs dark:border-slate-800 dark:bg-slate-900">
        <h3 className="flex items-center gap-2 text-base font-bold text-slate-900 dark:text-white mb-4">

        <div className="space-y-3 mb-6 max-h-96 overflow-y-auto pr-1">
          {task.updates.map((u) => {
            if (u.kind === 'system') {

                <div key={u.id} className="text-center text-xs text-slate-400 italic py-1">

            const author = allMembers.find((m) => m.id === u.authorId);
            return (
              <div key={u.id} className="flex gap-3">
                <div
                  onClick={() => author && onViewQuickProfile?.(author)}
                  className={`glacier-icon-bounce flex h-8 w-8 shrink-0 items-center justify-center rounded-full font-bold text-white text-xs overflow-hidden ${
                    author ? 'cursor-pointer hover:ring-2 hover:ring-sky-400' : ''
                  }`}
                  style={{ backgroundColor: colorFor(author?.id || '') }}
                  title={author ? `Xem thông tin của ${displayNameOf(author)}` : ''}
                >
                  {author?.avatarUrl ? (
                    <img src={author.avatarUrl} alt="" className="h-full w-full rounded-full object-cover" />
                  ) : (
                    author ? initials(displayNameOf(author)) : '?'
                  )}
                </div>
                <div className="flex-1 rounded-2xl bg-slate-50 p-3.5 dark:bg-slate-800/80 text-xs">
                  <div className="flex items-center justify-between mb-1">
                    <span 
                      onClick={() => author && onViewQuickProfile?.(author)}
                      className={`font-bold text-slate-900 dark:text-white ${
                        author ? 'cursor-pointer hover:text-sky-600 dark:hover:text-cyan-400 hover:underline' : ''
                      }`}
                      title={author ? `Xem thông tin của ${displayNameOf(author)}` : ''}
                    >
                      {displayNameOf(author)}
                    </span>
                    <span className="text-[11px] text-slate-400">{u.time}</span>
                  </div>
                  {u.kind === 'progress' && (
                    <span className="inline-block rounded bg-blue-100 px-1.5 py-0.5 text-[10px] font-bold text-blue-700 mb-1">
                      Báo cáo tiến độ

                    {u.text}
                  </p>
                </div>
              </div>
            );
          })}

          {task.updates.length === 0 && (
            <p className="text-center text-xs text-slate-400 py-4">Chưa có trao đổi nào.</p>
          )}
        </div>

        {/* Comment input */}
        <form onSubmit={handleSendComment} className="flex gap-2">
          <input
            type="text"
            value={commentText}
            onChange={(e) => setCommentText(e.target.value)}
            placeholder="Nhập trao đổi hoặc bình luận..."
            className="flex-1 rounded-xl border border-slate-200 p-2.5 text-sm dark:border-slate-700 dark:bg-slate-800 dark:text-white"
          />
          <button
            type="submit"
            className="inline-flex items-center gap-1 rounded-xl bg-blue-600 px-4 py-2 text-sm font-bold text-white hover:bg-blue-700"
          >
            <Send className="h-4 w-4" />
            Gửi
          </button>
        </form>
      </div>
    </div>
  );
};


// ==== ../workline_extract/src/components/MemberModal.tsx ====


interface MemberModalProps {
  isOpen: boolean;
  onClose: () => void;
  member: Member | null;
  allMembers: Member[];
  allTasks: Task[];
  currentUser: Member;
  onSave: (savedMember: Member) => void;
}

const MemberModal: React.FC<MemberModalProps> = ({
  isOpen,
  onClose,
  member,
  allMembers,
  allTasks,
  currentUser,
  onSave,
}) => {
  const [name, setName] = useState('');
  const [displayName, setDisplayName] = useState('');
  const [email, setEmail] = useState('');
  const [phone, setPhone] = useState('');
  const [team, setTeam] = useState('');
  const [code, setCode] = useState('');
  const [role, setRole] = useState<Role>('member');
  const [password, setPassword] = useState('');
  const [showPassword, setShowPassword] = useState(false);
  const [violations, setViolations] = useState<Violation[]>([]);
  const [avatarUrl, setAvatarUrl] = useState('');
  const fileInputRef = useRef<HTMLInputElement>(null);

  // New violation input
  const [newVioDate, setNewVioDate] = useState('');
  const [newVioNote, setNewVioNote] = useState('');

  // Validation errors
  const [errors, setErrors] = useState<Record<string, string>>({});

  useEffect(() => {
    if (member) {
      setName(member.name);
      setDisplayName(member.displayName || suggestedDisplayName(member.name));
      setEmail(member.email);
      setPhone(member.phone || '');
      setTeam(member.team || '');
      setCode(member.code || '');
      setRole(member.role);
      setPassword(member.password || '123');
      setViolations(member.violations || []);
      setAvatarUrl(member.avatarUrl || '');
    } else {
      setName('');
      setDisplayName('');
      setEmail('');
      setPhone('');
      setTeam('');
      setCode(generateMemberCode(allMembers));
      setRole('member');
      setPassword('123');
      setViolations([]);
      setAvatarUrl('');
    }
    setShowPassword(false);
    setNewVioDate('');
    setNewVioNote('');
    setErrors({});
  }, [member, isOpen, allMembers]);

  if (!isOpen) return null;

  const isEditing = Boolean(member);
  const isAdminUser = currentUser.role === 'admin';
  const isLeaderUser = currentUser.role === 'leader';

  const activeTaskCount = member
    ? allTasks.filter((t) => t.assignees.includes(member.id) && t.status !== 'hoan_thanh').length
    : 0;

  const handleNameChange = (val: string) => {
    setName(val);
    if (!displayName || displayName === suggestedDisplayName(name)) {
      setDisplayName(suggestedDisplayName(val));
    }
    if (errors.name) {
      setErrors((prev) => ({ ...prev, name: '' }));
    }
  };

  const handleGeneratePassword = () => {
    const newPass = generateRandomPassword(8);
    setPassword(newPass);
    setShowPassword(true);
  };

  const handleImageUpload = (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) {
      setErrors((prev) => ({ ...prev, avatar: 'Dung lượng ảnh tối đa 3MB.' }));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      setAvatarUrl(reader.result as string);
      setErrors((prev) => {
        const copy = { ...prev };
        delete copy.avatar;
        return copy;
      });
    };
    reader.readAsDataURL(file);
  };

  const handleAddViolation = () => {
    if (!newVioDate || !newVioNote.trim()) {
      setErrors((prev) => ({ ...prev, violation: 'Vui lòng chọn ngày và nhập nội dung vi phạm.' }));
      return;
    }
    const newV: Violation = {
      id: 'v' + Date.now(),
      date: newVioDate,
      note: newVioNote.trim(),
    };
    setViolations([newV, ...violations]);
    setNewVioDate('');
    setNewVioNote('');
    setErrors((prev) => ({ ...prev, violation: '' }));
  };

  const handleRemoveViolation = (id: string) => {
    setViolations(violations.filter((v) => v.id !== id));
  };

  // Permissions:
  // Admin can change anyone, including revoking Leader role
  // Leader cannot revoke Leader role of another leader
  // Leader cannot modify/demote Admin
  // Những admin được thêm không thể hạ quyền của Admin đã tạo mình / Admin Khải Danh
  const isTargetCreator = Boolean(
    isEditing && member && (
      (currentUser.createdBy && currentUser.createdBy === member.id) ||
      member.id === 'u0' ||
      member.email.toLowerCase() === 'danhhoangkhai03@gmail.com' ||
      member.code === 'WL-100'
    ) && member.id !== currentUser.id
  );

  const canSelectMember = (() => {
    if (isEditing && member) {
      if (member.role === 'leader') {
        return isAdminUser; // Admin có quyền xoá vai trò của Leader
      }
      if (member.role === 'admin') {
        if (member.id === currentUser.id) return false;
        if (isTargetCreator) return false;
        return isAdminUser;
      }
    }
    return true;
  })();

  const canSelectLeader = (() => {
    if (isEditing && member?.role === 'admin') {
      if (!isAdminUser || isTargetCreator) return false;
    }
    return isAdminUser || isLeaderUser;
  })();

  const canSelectAdmin = isAdminUser;

  const handleSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    const newErrors: Record<string, string> = {};

    if (!name.trim()) {
      newErrors.name = 'Họ và tên không được để trống.';
    }
    if (!email.trim()) {
      newErrors.email = 'Email không được để trống.';
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) {
      newErrors.email = 'Email không hợp lệ (vd: ten@workline.vn).';
    } else {
      const duplicate = allMembers.find(
        (m) => m.email.toLowerCase() === email.trim().toLowerCase() && m.id !== member?.id
      );
      if (duplicate) {
        newErrors.email = 'Email này đã tồn tại trong hệ thống.';
      }
    }

    if (code.trim()) {
      const dupCode = allMembers.find(
        (m) => m.code?.toLowerCase() === code.trim().toLowerCase() && m.id !== member?.id
      );
      if (dupCode) {
        newErrors.code = `Mã ${code} đã thuộc về ${dupCode.name}.`;
      }
    }

    if (member && member.id === currentUser.id && member.role === 'admin' && role !== 'admin') {
      newErrors.role = 'Tài khoản Admin chính không thể tự hủy vai trò Admin của mình.';
    }

    if (isTargetCreator && member && member.role === 'admin' && role !== 'admin') {
      newErrors.role = `Bạn không có quyền thay đổi vai trò của Quản trị viên đã tạo tài khoản của bạn (${member.name}).`;
    }

    if (member && member.id === currentUser.id && member.role === 'leader' && role !== 'leader' && !isAdminUser) {
      newErrors.role = 'Bạn không thể tự hạ quyền của chính mình.';
    }

    if (!isAdminUser && role === 'admin') {

    }

    if (Object.keys(newErrors).length > 0) {
      setErrors(newErrors);
      return;
    }

      id: member ? member.id : 'u' + Date.now(),
      code: code.trim() || generateMemberCode(allMembers),
      name: name.trim(),
      displayName: displayName.trim() || suggestedDisplayName(name.trim()),

    onClose();
  };

  useEffect(() => {
    const handleKeyDown = (e: KeyboardEvent) => {

    window.addEventListener('keydown', handleKeyDown);

interface TaskModalProps {
  isOpen: boolean;
  onClose: () => void;
  currentUser: Member;
  allMembers: Member[];
  onSave: (task: Task) => void;
}

const TaskModal: React.FC<TaskModalProps> = ({
  isOpen,
  onClose,
  currentUser,
  allMembers,
  onSave,
}) => {
  const [title, setTitle] = useState('');
  const [type, setType] = useState<TaskType>('chung');
  const [scope, setScope] = useState<TaskScope>('thanhvien');
  const [targetAudience, setTargetAudience] = useState('');
  const [detail, setDetail] = useState('');
  const [deadlineDate, setDeadlineDate] = useState('');
  const [deadlineTime, setDeadlineTime] = useState('17:00');
  const [selectedAssignees, setSelectedAssignees] = useState<string[]>([]);
  const [assigneeSearch, setAssigneeSearch] = useState('');
  const [error, setError] = useState('');

  if (!isOpen) return null;

  const filteredMembers = allMembers.filter((m) => {
    const q = assigneeSearch.toLowerCase();
    return (
      m.name.toLowerCase().includes(q) ||
      m.email.toLowerCase().includes(q) ||
      (m.team && m.team.toLowerCase().includes(q))
    );
  });

  const toggleAssignee = (id: string) => {
    if (selectedAssignees.includes(id)) {
      setSelectedAssignees(selectedAssignees.filter((x) => x !== id));
    } else {
      setSelectedAssignees([...selectedAssignees, id]);
    }
  };

  const handleSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    if (!title.trim()) {
      setError('Vui lòng nhập tiêu đề công việc.');
      return;
    }
    if (!deadlineDate) {
      setError('Vui lòng chọn ngày hết hạn.');
      return;
    }

    const fullDeadline = `${deadlineDate}T${deadlineTime || '17:00'}`;
    const assignees = scope === 'tatca' ? allMembers.map((m) => m.id) : selectedAssignees;

    if (scope !== 'tatca' && assignees.length === 0) {
      setError('Vui lòng chọn ít nhất một thành viên phụ trách.');
      return;
    }

    const newTask: Task = {
      id: 't' + Date.now(),
      code: 'TASK-' + (100 + Math.floor(Math.random() * 900)),
      title: title.trim(),
      type,
      scope,
      targetAudience: targetAudience.trim(),
      detail: detail.trim(),
      assignees,
      acceptedBy: [],
      creator: currentUser.id,
      createdAt: todayIso() + 'T09:00:00',
      deadline: fullDeadline,
      status: 'cho_nhan',
      updates: [],
    };

    onSave(newTask);
    onClose();
  };

  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-slate-950/70 p-3 sm:p-4 backdrop-blur-md">
      <div className="w-full max-w-4xl lg:max-w-5xl rounded-2xl bg-white dark:bg-slate-900 border border-sky-200/80 dark:border-sky-900/60 shadow-2xl p-4 sm:p-5 max-h-[92vh] flex flex-col glacier-spring-in">
        {/* Header */}
        <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 shrink-0">
          <div className="flex items-center gap-2">
            <div className="flex h-7 w-7 items-center justify-center rounded-lg bg-sky-100 text-sky-600 dark:bg-sky-950 dark:text-cyan-400">
              <Plus className="h-4 w-4" />
            </div>
            <div>
              <h3 className="text-base font-black text-slate-800 dark:text-slate-100">

interface ExtendModalProps {
  task: Task | null;
  currentUser: Member;
  onClose: () => void;
  onConfirmExtend: (taskId: string, newDeadline: string, reason: string) => void;
}

const ExtendModal: React.FC<ExtendModalProps> = ({
  task,
  currentUser,
  onClose,
  onConfirmExtend,
}) => {
  const [date, setDate] = useState('');
  const [time, setTime] = useState('17:00');
  const [reason, setReason] = useState('');
  const [error, setError] = useState('');

  if (!task) return null;

  const isLeader = currentUser.role === 'leader';
  const isAdmin = currentUser.role === 'admin';

  const handleSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    if (!date) {
      setError('Vui lòng chọn ngày hết hạn mới.');
      return;
    }
    const newDeadline = `${date}T${time || '17:00'}`;
    if (newDeadline <= task.deadline) {
      setError('Hạn chót mới phải sau hạn chót hiện tại.');
      return;
    }
    // Admin: lý do gia hạn là không bắt buộc. Leader/Thành viên: bắt buộc.
    if (!isAdmin && !reason.trim()) {
      setError('Vui lòng nhập lý do gia hạn (bắt buộc).');
      return;
    }

    onConfirmExtend(task.id, newDeadline, reason.trim());
    onClose();
  };

  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 backdrop-blur-md">
      <div className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900 border border-slate-100 dark:border-slate-800">
        <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
          <div className="flex items-center gap-2">
            <Clock className="h-5 w-5 text-amber-500" />
            <h3 className="text-base font-bold text-slate-900 dark:text-white">
              {isLeader ? 'Gia hạn công việc' : 'Xin gia hạn công việc'}
            </h3>
          </div>
          <button type="button" onClick={onClose} className="rounded-lg p-1 text-slate-400 hover:bg-slate-100">
            <X className="h-5 w-5" />
          </button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-4 pt-4 text-xs">
          {error && (
            <div className="flex items-center gap-2 rounded-xl bg-rose-50 p-2.5 text-rose-600 font-semibold">
              <AlertCircle className="h-4 w-4 shrink-0" />
              {error}
            </div>
          )}

          <div>
            <span className="text-slate-400 font-semibold block mb-1">Công việc:</span>
            <div className="font-bold text-slate-800 dark:text-slate-200 text-sm">{task.title}</div>
            <div className="text-slate-400 mt-0.5">Hạn hiện tại: {fmtDeadline(task.deadline)}</div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block font-bold text-slate-600 dark:text-slate-300 mb-1">
                Ngày gia hạn mới
              </label>
              <input
                type="date"
                value={date}
                min={todayIso()}
                onChange={(e) => setDate(e.target.value)}
                className="w-full rounded-xl border border-slate-200 p-2 text-xs dark:border-slate-700 dark:bg-slate-800 dark:text-white"
              />
            </div>
            <div>
              <label className="block font-bold text-slate-600 dark:text-slate-300 mb-1">
                Giờ gia hạn mới
              </label>
              <input
                type="time"
                value={time}
                onChange={(e) => setTime(e.target.value)}
                className="w-full rounded-xl border border-slate-200 p-2 text-xs dark:border-slate-700 dark:bg-slate-800 dark:text-white"
              />
            </div>
          </div>

          <div>
            <label className="block font-bold text-slate-600 dark:text-slate-300 mb-1">
              Lý do gia hạn{' '}
              {isAdmin ? (
                <span className="text-slate-400 font-normal">(Không bắt buộc)</span>
              ) : (
                <span className="text-rose-500">* (bắt buộc)</span>

            </label>
            <textarea
              rows={3}
              value={reason}
              onChange={(e) => setReason(e.target.value)}

                isAdmin
                  ? 'VD: Cần thêm thời gian kiểm thử hoặc chờ số liệu... (có thể bỏ trống)'

            />
          </div>

          <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
            <button
              type="button"
              onClick={onClose}
              className="glacier-btn-bounce rounded-xl border border-slate-200 px-3 py-2 font-semibold text-slate-600 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300"
