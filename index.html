// ==== ../workline_extract/src/components/LoginView.tsx ====


interface LoginViewProps {
  members: Member[];
  onLogin: (user: Member, token?: string) => void;
}

const LoginView: React.FC<LoginViewProps> = ({ onLogin }) => {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showLoginPassword, setShowLoginPassword] = useState(false);
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [mode, setMode] = useState<'login' | 'forgot' | 'otp' | 'reset'>('login');
  const [forgotEmail, setForgotEmail] = useState('');
  const [forgotSent, setForgotSent] = useState(false);
  const [forgotMessage, setForgotMessage] = useState('');
  const [forgotError, setForgotError] = useState('');

  const [resetToken, setResetToken] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [resetError, setResetError] = useState('');
  const [resetDone, setResetDone] = useState(false);

  // ==== Xac thuc OTP & dat mat khau moi (giao dien Workline) ====
  const OTP_LENGTH = 6;
  const OTP_RESEND_SECONDS = 60;
  const [otpDigits, setOtpDigits] = useState<string[]>(Array(OTP_LENGTH).fill(''));
  const [otpNewPassword, setOtpNewPassword] = useState('');
  const [otpConfirmPassword, setOtpConfirmPassword] = useState('');
  const [showOtpPassword, setShowOtpPassword] = useState(false);
  const [showOtpConfirmPassword, setShowOtpConfirmPassword] = useState(false);
  const [otpError, setOtpError] = useState('');
  const [otpDone, setOtpDone] = useState(false);
  const [otpSubmitting, setOtpSubmitting] = useState(false);
  const [resending, setResending] = useState(false);
  const [resendSeconds, setResendSeconds] = useState(0);
  const otpInputRefs = useRef<(HTMLInputElement | null)[]>([]);

  useEffect(() => {
    if (mode !== 'otp' || resendSeconds <= 0) return;
    const timer = setInterval(() => {
      setResendSeconds((s) => (s > 0 ? s - 1 : 0));
    }, 1000);
    return () => clearInterval(timer);
  }, [mode, resendSeconds]);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const tokenFromUrl = params.get('resetToken');
    if (tokenFromUrl) {
      setResetToken(tokenFromUrl);
      setMode('reset');
    }
  }, []);

  const handleSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    setError('');
    setSubmitting(true);
    try {
      const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.trim(), password }),
      });
      const data = await res.json();
      if (!res.ok) {
        setError(data.error || 'Email hoặc mật khẩu không chính xác.');
        return;
      }
      onLogin(data.member, data.token);
    } catch (err) {
      setError('Không thể kết nối máy chủ. Vui lòng thử lại sau.');
    } finally {
      setSubmitting(false);
    }
  };

  const requestOtp = async (): Promise<boolean> => {
    try {
      const res = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: forgotEmail.trim() }),
      });
      const data = await res.json();
      if (!res.ok) {
        setForgotError(data.error || 'Không thể gửi mã OTP. Vui lòng kiểm tra lại email.');
        return false;
      }
      setForgotMessage(
        data.message ||
          `Mã OTP đã được gửi đến ${forgotEmail.trim()}. Mã có hiệu lực trong 10 phút.`
      );
      return true;
    } catch (err) {
      setForgotError('Không thể kết nối máy chủ. Vui lòng thử lại sau.');
      return false;
    }
  };

  const handleForgotSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    setForgotError('');
    setSubmitting(true);
    try {
      const ok = await requestOtp();
      if (ok) {
        setOtpDigits(Array(OTP_LENGTH).fill(''));
        setOtpError('');
        setOtpNewPassword('');
        setOtpConfirmPassword('');
        setResendSeconds(OTP_RESEND_SECONDS);
        setMode('otp');
        setTimeout(() => otpInputRefs.current[0]?.focus(), 50);
      }
    } finally {
      setSubmitting(false);
    }
  };

  const handleResendOtp = async () => {
    if (resendSeconds > 0 || resending) return;
    setResending(true);
    setOtpError('');
    try {
      const ok = await requestOtp();
      if (ok) {
        setOtpDigits(Array(OTP_LENGTH).fill(''));
        setResendSeconds(OTP_RESEND_SECONDS);
        otpInputRefs.current[0]?.focus();
      } else {
        setOtpError(forgotError || 'Không thể gửi lại mã OTP. Vui lòng thử lại.');
      }
    } finally {
      setResending(false);
    }
  };

  const handleOtpDigitChange = (index: number, value: string) => {
    const digit = value.replace(/[^0-9]/g, '').slice(-1);
    setOtpDigits((prev) => {
      const next = [...prev];
      next[index] = digit;
      return next;
    });
    if (digit && index < OTP_LENGTH - 1) {
      otpInputRefs.current[index + 1]?.focus();
    }
  };

  const handleOtpKeyDown = (index: number, e: React.KeyboardEvent<HTMLInputElement>) => {
    if (e.key === 'Backspace' && !otpDigits[index] && index > 0) {
      otpInputRefs.current[index - 1]?.focus();
    }
  };

  const handleOtpPaste = (e: React.ClipboardEvent<HTMLInputElement>) => {
    const pasted = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, OTP_LENGTH);
    if (!pasted) return;
    e.preventDefault();
    const next = Array(OTP_LENGTH).fill('');
    for (let i = 0; i < pasted.length; i++) next[i] = pasted[i];
    setOtpDigits(next);
    const focusIndex = Math.min(pasted.length, OTP_LENGTH - 1);
    otpInputRefs.current[focusIndex]?.focus();
  };

  const handleOtpResetSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    setOtpError('');

    const otp = otpDigits.join('');
    if (otp.length !== OTP_LENGTH) {
      setOtpError(`Vui lòng nhập đủ ${OTP_LENGTH} chữ số của mã OTP.`);
      return;
    }
    if (otpNewPassword.length < 6) {
      setOtpError('Mật khẩu mới phải có ít nhất 6 ký tự.');
      return;
    }
    if (otpNewPassword !== otpConfirmPassword) {
      setOtpError('Xác nhận mật khẩu không khớp.');
      return;
    }

    setOtpSubmitting(true);
    try {
      const res = await fetch(`${API_BASE_URL}/api/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: forgotEmail.trim(),
          otp,
          newPassword: otpNewPassword,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        setOtpError(data.error || 'Mã OTP không chính xác hoặc đã hết hạn.');
        return;
      }
      setOtpDone(true);
    } catch (err) {
      setOtpError('Không thể kết nối máy chủ. Vui lòng thử lại sau.');
    } finally {
      setOtpSubmitting(false);
    }
  };

  const handleResetSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    setResetError('');

    if (newPassword.length < 6) {
      setResetError('Mật khẩu mới phải có ít nhất 6 ký tự.');
      return;
    }
    if (newPassword !== confirmPassword) {
      setResetError('Xác nhận mật khẩu không khớp.');
      return;
    }

    setSubmitting(true);
    try {
      const res = await fetch(`${API_BASE_URL}/api/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: resetToken, newPassword }),
      });
      const data = await res.json();
      if (!res.ok) {
        setResetError(data.error || 'Có lỗi xảy ra, vui lòng thử lại.');
        return;
      }
      setResetDone(true);
    } catch (err) {
      setResetError('Không thể kết nối máy chủ. Vui lòng thử lại sau.');
    } finally {
      setSubmitting(false);
    }
  };

  const handleBackToLogin = () => {
    setMode('login');
    setForgotEmail('');
    setForgotSent(false);
    setForgotMessage('');
    setForgotError('');
    setResetError('');
    setResetDone(false);
    setOtpDigits(Array(OTP_LENGTH).fill(''));
    setOtpNewPassword('');
    setOtpConfirmPassword('');
    setOtpError('');
    setOtpDone(false);
    setResendSeconds(0);
    // Xoa resetToken khoi URL de tranh vao lai man reset khi f5
    const url = new URL(window.location.href);
    url.searchParams.delete('resetToken');
    window.history.replaceState({}, '', url.toString());
  };

        {mode === 'login' && (
          <>
            <h2 className="text-xl font-black text-white text-center">Đăng nhập không gian làm việc</h2>
            <p className="text-xs text-slate-400 mt-1 text-center">

            </p>

            {error && (
              <div className="mt-4 flex items-center gap-2 rounded-xl bg-rose-500/10 border border-rose-500/20 p-3 text-xs font-semibold text-rose-400">
                <AlertCircle className="h-4 w-4 shrink-0" />
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="mt-6 space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
                  Email đăng nhập
                </label>
                <div className="relative">
                  <Mail className="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400" />
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="ten@workline.vn"
                    className="w-full rounded-xl border border-slate-700 bg-slate-800/80 py-2.5 pl-10 pr-3.5 text-sm text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                  />
                </div>
              </div>

              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-300">
                    Mật khẩu
                  </label>
                  <button
                    type="button"
                    onClick={() => setMode('forgot')}
                    className="text-xs font-semibold text-blue-400 hover:text-blue-300 hover:underline transition-colors"
                  >
                    Quên mật khẩu?
                  </button>
                </div>
                <div className="relative">
                  <Lock className="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400" />
                  <input
                    type={showLoginPassword ? 'text' : 'password'}
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full rounded-xl border border-slate-700 bg-slate-800/80 py-2.5 pl-10 pr-10 text-sm text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                  />
                  <button
                    type="button"
                    onClick={() => setShowLoginPassword(!showLoginPassword)}
                    className="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-blue-400 transition-colors cursor-pointer"
                    title={showLoginPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'}
                    aria-label={showLoginPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'}
                  >
                    {showLoginPassword ? <EyeOff className="h-4 w-4" /> : <Eye className="h-4 w-4" />}
                  </button>
                </div>
              </div>

              <button
                type="submit"
                disabled={submitting}
                className="w-full rounded-xl bg-blue-600 py-3 text-sm font-bold text-white shadow-lg shadow-blue-600/30 hover:bg-blue-500 transition-all active:scale-[0.98] disabled:opacity-60"
              >
                {submitting ? 'Đang đăng nhập...' : 'Đăng nhập hệ thống'}
              </button>
            </form>
          </>
        )}

            <p className="text-xs text-slate-400 mt-1 text-center">

                    required

// ==== ../workline_extract/src/App.tsx ====


interface Toast {
  id: string;
  type: 'success' | 'error' | 'info';
  message: string;
}
// Bản ghi những task đã đồng bộ lên server (id -> JSON) để biết task nào mới đổi
const taskSync = { synced: new Map<string, string>() };
// Bản ghi thông báo đã đồng bộ lên server (id -> đã đọc hay chưa)
const notifSync = { synced: new Map<string, boolean>() };
function App() {
  const [members, setMembers] = useState<Member[]>(() => {
    const saved = localStorage.getItem('workline_members');
    if (!saved) return INITIAL_MEMBERS;
    try {
      const parsed: Member[] = JSON.parse(saved);
      // Ensure admin accounts from INITIAL_MEMBERS are present
      for (const initM of INITIAL_MEMBERS) {
        const found = parsed.find((p) => p.email.toLowerCase() === initM.email.toLowerCase());
        if (!found) {
          parsed.unshift(initM);
        } else {
          if (initM.role === 'admin' && found.role !== 'admin') {
            found.role = 'admin';
          }
          if (initM.createdBy && !found.createdBy) {
            found.createdBy = initM.createdBy;
            found.createdByName = initM.createdByName;
          }
        }
      }
      return parsed;
    } catch {
      return INITIAL_MEMBERS;
    }
  });

  const [tasks, setTasks] = useState<Task[]>(() => {
    const saved = localStorage.getItem('workline_tasks');
    return saved ? JSON.parse(saved) : INITIAL_TASKS;
  });

  const [currentUser, setCurrentUser] = useState<Member | null>(() => {
    const saved = localStorage.getItem('workline_user');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed) return parsed;
      } catch {
        // fallback
      }
    }
    // Không tự động đăng nhập - luôn yêu cầu đăng nhập bằng tài khoản thật
    return null;
  });

  const [authToken, setAuthToken] = useState<string | null>(() => localStorage.getItem('workline_token'));

  // Tải danh sách nhân sự thật từ server khi vào trang
  useEffect(() => {
    if (!authToken) return;
    (async () => {
      try {
        const res = await fetch(`${API_BASE_URL}/api/members`, {
          headers: { Authorization: `Bearer ${authToken}` },
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.members) {
          setMembers(data.members);
        }
      } catch (err) {
        console.error('Load members error:', err);
      }
    })();
  }, [authToken]);
  const [currentView, setCurrentView] = useState<'home' | 'members' | 'profile' | 'taskdetail'>('home');
  const [selectedTaskId, setSelectedTaskId] = useState<string | null>(null);
  const [isSidebarOpen, setIsSidebarOpen] = useState(true);
  
  // Per-user theme preference state
  const [isDark, setIsDark] = useState<boolean>(() => {
    const savedUser = localStorage.getItem('workline_user');
    let uid = 'u1';
    if (savedUser) {
      try {
        const parsed = JSON.parse(savedUser);
        if (parsed?.id) uid = parsed.id;
      } catch {}
    }
    const userTheme = localStorage.getItem(`workline_theme_${uid}`);
    if (userTheme) return userTheme === 'dark';
    return false;
  });

  // Modals state
  const [editingMember, setEditingMember] = useState<Member | null>(null);
  const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
  const [quickProfileMember, setQuickProfileMember] = useState<Member | null>(null);
  const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
  const [extendTask, setExtendTask] = useState<Task | null>(null);

  // Notifications
  const [notifications, setNotifications] = useState<EmailNotification[]>(() => {
    const saved = localStorage.getItem('workline_notifications');
    if (saved) {
      try {
        return JSON.parse(saved);
      } catch {}
    }
    return [];
  });

  const sendNotification = ({
    to,
    toName,
    subject,
    body,
    taskId,
  }: {
    to: string;
    toName: string;
    subject: string;
    body: string;
    taskId?: string | null;
  }) => {
    const now = new Date();
    const timeStr = `${now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' })} ${now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}`;
    const newNotif: EmailNotification = {
      id: 'notif-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
      to,
      toName,
      subject,
      body,
      time: timeStr,
      read: false,
      taskId: taskId || null,
    };
    setNotifications((prev) => [newNotif, ...prev]);
  };

  // Toast system
  const [toasts, setToasts] = useState<Toast[]>([]);

  const addToast = (type: 'success' | 'error' | 'info', message: string) => {
    const id = 'toast-' + Date.now() + Math.random();
    setToasts((prev) => [...prev, { id, type, message }]);
    setTimeout(() => {
      setToasts((prev) => prev.filter((t) => t.id !== id));
    }, 3800);
  };

  // Sync theme per user account
  useEffect(() => {
    if (currentUser) {
      const userThemeKey = `workline_theme_${currentUser.id}`;
      const savedUserTheme = localStorage.getItem(userThemeKey);
      const targetTheme = savedUserTheme || currentUser.theme || 'light';
      const shouldBeDark = targetTheme === 'dark';
      setIsDark(shouldBeDark);
      if (shouldBeDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
  }, [currentUser?.id]);

  // Sync dark mode class whenever isDark changes
  useEffect(() => {
    if (isDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }, [isDark]);

  const handleToggleTheme = (specificTheme?: 'light' | 'dark') => {
    const newDark = specificTheme ? specificTheme === 'dark' : !isDark;
    setIsDark(newDark);
    const newTheme = newDark ? 'dark' : 'light';
    if (currentUser) {
      localStorage.setItem(`workline_theme_${currentUser.id}`, newTheme);
      const updatedUser: Member = { ...currentUser, theme: newTheme };
      setCurrentUser(updatedUser);
      setMembers((prev) => prev.map((m) => (m.id === currentUser.id ? updatedUser : m)));
    }
    if (newDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  };

  // Persist storage
  useEffect(() => {
    localStorage.setItem('workline_members', JSON.stringify(members));
  }, [members]);

  useEffect(() => {
    localStorage.setItem('workline_tasks', JSON.stringify(tasks));
  }, [tasks]);

  useEffect(() => {
    localStorage.setItem('workline_notifications', JSON.stringify(notifications));
  }, [notifications]);

  useEffect(() => {
    if (currentUser) {
      localStorage.setItem('workline_user', JSON.stringify(currentUser));
    } else {
      localStorage.removeItem('workline_user');
    }
  }, [currentUser]);
  // ===== Task: tải từ server khi vào trang, lưu lên server khi có thay đổi =====
  const [tasksLoaded, setTasksLoaded] = useState(false);

  useEffect(() => {
    if (!authToken) {
      setTasksLoaded(false);
      return;
    }
    let cancelled = false;
    (async () => {
      try {
        const res = await fetch(`${API_BASE_URL}/api/tasks`, {
          headers: { Authorization: `Bearer ${authToken}` },
        });
        if (!res.ok) return;
        const data = await res.json();
        if (cancelled || !Array.isArray(data.tasks)) return;
        taskSync.synced = new Map<string, string>(data.tasks.map((t: Task) => [t.id, JSON.stringify(t)]));
        setTasks(data.tasks);
        setTasksLoaded(true);
      } catch (err) {
        console.error('Load tasks error:', err);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [authToken]);

  useEffect(() => {
    if (!authToken || !tasksLoaded) return;
    const headers = {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${authToken}`,
    };
    const prev = taskSync.synced;
    const currentIds = new Set<string>();

    for (const t of tasks) {
      currentIds.add(t.id);
      const json = JSON.stringify(t);
      if (prev.get(t.id) === json) continue;
      prev.set(t.id, json);
      fetch(`${API_BASE_URL}/api/tasks/${encodeURIComponent(t.id)}`, {
        method: 'PUT',
        headers,
        body: json,
      })
        .then(async (res) => {
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            console.error('Save task error:', data.error);
            prev.delete(t.id); // lần thay đổi sau sẽ gửi lại
            return;
          }
          // Server sinh mã TASK-xxx thật, cập nhật lại cho khớp
          if (data.task && data.task.code !== t.code) {
            setTasks((p) => p.map((x) => (x.id === t.id ? { ...x, code: data.task.code } : x)));
          }
        })
        .catch((err) => {
          console.error('Save task error:', err);
          prev.delete(t.id);
        });
    }

    for (const id of Array.from(prev.keys())) {
      if (currentIds.has(id)) continue;
      prev.delete(id);
      fetch(`${API_BASE_URL}/api/tasks/${encodeURIComponent(id)}`, {
        method: 'DELETE',
        headers,
      }).catch((err) => console.error('Delete task error:', err));
    }
  }, [tasks, authToken, tasksLoaded]);
  // ===== Thông báo: tải từ server, gửi thông báo mới, đồng bộ trạng thái đã đọc =====
  const [notifsLoaded, setNotifsLoaded] = useState(false);

  useEffect(() => {
    if (!authToken) {
      setNotifsLoaded(false);
      return;
    }
    let cancelled = false;
    const load = async (first: boolean) => {
      try {
        const res = await fetch(`${API_BASE_URL}/api/notifications`, {
          headers: { Authorization: `Bearer ${authToken}` },
        });
        if (!res.ok) return;
        const data = await res.json();
        if (cancelled || !Array.isArray(data.notifications)) return;
        const server: EmailNotification[] = data.notifications;
        if (first) notifSync.synced = new Map<string, boolean>();
        const serverRead = new Map<string, boolean>();
        for (const n of server) {
          serverRead.set(n.id, n.read);
          notifSync.synced.set(n.id, n.read);
        }
        setNotifications((prev) => {
          const localIds = new Set(prev.map((n) => n.id));
          const fresh = server.filter((n) => !localIds.has(n.id));
          const updated = prev.map((n) => (serverRead.get(n.id) && !n.read ? { ...n, read: true } : n));
          const changed = fresh.length > 0 || updated.some((n, i) => n !== prev[i]);
          return changed ? [...fresh, ...updated] : prev;
        });
        if (first) setNotifsLoaded(true);
      } catch (err) {
        console.error('Load notifications error:', err);
      }
    };
    load(true);
    const timer = setInterval(() => load(false), 30000); // kiểm tra thông báo mới mỗi 30 giây
    return () => {
      cancelled = true;
      clearInterval(timer);
    };
  }, [authToken]);

  useEffect(() => {
    if (!authToken || !notifsLoaded) return;
    const headers = {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${authToken}`,
    };
    const prev = notifSync.synced;
    const currentIds = new Set<string>();
    const toSend: EmailNotification[] = [];

    for (const n of notifications) {
      currentIds.add(n.id);
      if (prev.get(n.id) === n.read) continue;
      prev.set(n.id, n.read);
      toSend.push(n);
    }
    const removed = Array.from(prev.keys()).filter((id) => !currentIds.has(id));
    removed.forEach((id) => prev.delete(id));

    if (toSend.length > 0) {
      fetch(`${API_BASE_URL}/api/notifications`, {
        method: 'POST',
        headers,
        body: JSON.stringify({ notifications: toSend }),
      })
        .then((res) => {
          if (!res.ok) toSend.forEach((n) => prev.delete(n.id)); // lần thay đổi sau sẽ gửi lại
        })
        .catch(() => toSend.forEach((n) => prev.delete(n.id)));
    }
    if (removed.length > 0) {
      fetch(`${API_BASE_URL}/api/notifications/delete`, {
        method: 'POST',
        headers,
        body: JSON.stringify({ ids: removed }),
      }).catch((err) => console.error('Delete notifications error:', err));
    }
  }, [notifications, authToken, notifsLoaded]);

    // ===== Task: tự làm mới từ server mỗi 30 giây =====
  useEffect(() => {
    if (!authToken || !tasksLoaded) return;
    let cancelled = false;
    const refresh = async () => {
      try {
        const res = await fetch(`${API_BASE_URL}/api/tasks`, {
          headers: { Authorization: `Bearer ${authToken}` },
        });
        if (!res.ok) return;
        const data = await res.json();
        if (cancelled || !Array.isArray(data.tasks)) return;
        const server: Task[] = data.tasks;
        const synced = taskSync.synced;
        setTasks((prev) => {
          const prevById = new Map<string, Task>(prev.map((t) => [t.id, t]));
          const serverIds = new Set<string>();
          const next: Task[] = [];
          let changed = false;
          for (const s of server) {
            serverIds.add(s.id);
            const sJson = JSON.stringify(s);
            const local = prevById.get(s.id);
            if (!local) {
              synced.set(s.id, sJson);
              next.push(s);
              changed = true;
              continue;
            }
            const localJson = JSON.stringify(local);
            if (localJson === sJson) {
              synced.set(s.id, sJson);
              next.push(local);
            } else if (synced.get(s.id) === localJson) {

            }
          }
          for (const t of prev) {
            if (!serverIds.has(t.id)) next.push(t);
          }
          return changed ? next : prev;
        });
      } catch (err) {
        console.error('Refresh tasks error:', err);
      }
    };

    let banner: HTMLDivElement | null = null;

    const b64ToUint8 = (b64: string) => {
      const pad = '='.repeat((4 - (b64.length % 4)) % 4);
      const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
      return Uint8Array.from(raw, (c) => c.charCodeAt(0));
    };

      try {

        await navigator.serviceWorker.register('sw.js');
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: b64ToUint8(key),
          });
        }
        await fetch(`${API_BASE_URL}/api/push/subscribe`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',

      const yes = document.createElement('button');

      const no = document.createElement('button');

      yes.onclick = async () => {

                  id: 'up-' + Date.now(),
                  kind: 'system',
                  text: `${displayNameOf(currentUser)} đã gia hạn task đến ${newDeadline.replace('T', ' ')}${
                    reason ? ' — Lý do: ' + reason : ''
                  }`,
                  time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
                },
              ],
            };
          } else {
            const newReq = {
              id: 'er-' + Date.now(),
              requesterId: currentUser.id,
              requestedDeadline: newDeadline,
              reason,
              createdAt: new Date().toISOString(),
              status: 'pending' as const,
            };
            return {
              ...t,
              extensionRequests: [...(t.extensionRequests || []), newReq],
              updates: [
                ...t.updates,
                {
                  id: 'up-' + Date.now(),
                  kind: 'system',
                  text: `${displayNameOf(currentUser)} đã xin gia hạn đến ${newDeadline.replace('T', ' ')}: ${reason}`,
                  time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
                },
              ],
            };
          }
        }
        return t;
      })
    );

    if (!isLeader) {
      setNotifications((prev) => [
        {
          id: 'notif-' + Date.now(),
          to: 'leader@workline.vn',
          toName: 'Leader',
          subject: `${displayNameOf(currentUser)} xin gia hạn task`,
          body: `Lý do: ${reason} (Hạn mới: ${newDeadline.replace('T', ' ')}) - Task: ${taskName}`,
          time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
          read: false,
          taskId,
        },
        ...prev,
      ]);
    }

    addToast('success', isLeader ? 'Đã gia hạn công việc thành công.' : 'Đã gửi yêu cầu gia hạn tới Leader.');
  };

  const handleApproveExtension = (taskId: string, reqId: string) => {
    let taskTitle = '';
    let targetReq: any = null;

    setTasks((prev) =>
      prev.map((t) => {
        if (t.id === taskId) {
          taskTitle = t.title;
          const updatedReqs = (t.extensionRequests || []).map((r) => {
            if (r.id === reqId) {
              targetReq = r;
              return {
                ...r,
                status: 'approved' as const,
                resolvedBy: currentUser.id,
                resolvedAt: new Date().toISOString(),
              };
            }
            return r;
          });

          const newDeadline = targetReq ? targetReq.requestedDeadline : t.deadline;

          return {
            ...t,
            deadline: newDeadline,
            extensionRequests: updatedReqs,
            updates: [
              ...t.updates,
              {
                id: 'up-' + Date.now(),
                kind: 'system',
                text: `${displayNameOf(currentUser)} đã chấp thuận gia hạn deadline đến ${newDeadline.replace('T', ' ')}.`,
                time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
              },
            ],
          };
        }
        return t;
      })
    );

    if (targetReq) {
      const requester = members.find((m) => m.id === targetReq.requesterId);
      if (requester) {
        setNotifications((prev) => [
          {
            id: 'notif-' + Date.now(),
            to: requester.email,
            toName: displayNameOf(requester),
            subject: `Yêu cầu gia hạn đã được DUYỆT: ${taskTitle}`,
            body: `Leader ${displayNameOf(currentUser)} đã chấp thuận gia hạn deadline đến ${targetReq.requestedDeadline.replace('T', ' ')}.`,
            time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
            read: false,
            taskId,
          },
          ...prev,
        ]);
      }
    }

    addToast('success', 'Đã duyệt yêu cầu gia hạn công việc thành công.');
  };

  const handleRejectExtension = (taskId: string, reqId: string, note?: string) => {
    let taskTitle = '';
    let targetReq: any = null;

    setTasks((prev) =>
      prev.map((t) => {
        if (t.id === taskId) {
          taskTitle = t.title;
          const updatedReqs = (t.extensionRequests || []).map((r) => {
            if (r.id === reqId) {
              targetReq = r;
              return {
                ...r,
                status: 'rejected' as const,
                resolvedBy: currentUser.id,
                resolvedAt: new Date().toISOString(),
                responseNote: note || 'Không chấp thuận gia hạn.',
              };
            }
            return r;
          });

          return {
            ...t,
            extensionRequests: updatedReqs,
            updates: [
              ...t.updates,
              {
                id: 'up-' + Date.now(),
                kind: 'system',
                text: `${displayNameOf(currentUser)} đã từ chối yêu cầu gia hạn${note ? ': ' + note : '.'}`,
                time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
              },
            ],
          };
        }
        return t;
      })
    );

    if (targetReq) {
      const requester = members.find((m) => m.id === targetReq.requesterId);
      if (requester) {
        setNotifications((prev) => [
          {
            id: 'notif-' + Date.now(),
            to: requester.email,
            toName: displayNameOf(requester),
            subject: `Yêu cầu gia hạn đã bị TỪ CHỐI: ${taskTitle}`,
            body: `Leader ${displayNameOf(currentUser)} không chấp thuận gia hạn${note ? ': ' + note : ''}.`,
            time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
            read: false,
            taskId,
          },
          ...prev,
        ]);
      }
    }

    addToast('info', 'Đã từ chối yêu cầu gia hạn.');
  };

  const selectedTask = selectedTaskId ? tasks.find((t) => t.id === selectedTaskId) : null;

  const userNotifications = notifications.filter((n) => {
    return (
      n.to === currentUser.id ||
      n.to === currentUser.email ||
      n.to === 'all' ||
      (currentUser.role === 'leader' && (n.to === 'leader@workline.vn' || n.to === 'leader'))
    );
  });

  return (
    <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors">
      <Header
        currentUser={currentUser}
        allMembers={members}
        onSwitchUser={(user) => {
          if (currentUser.role === 'member' && user.role === 'admin') {
            addToast('error', 'Thành viên không được phép truy cập quyền Quản trị viên (Admin).');
            return;
          }
          if (currentUser.role !== 'admin' && user.role === 'admin') {
            addToast('error', 'Chỉ Quản trị viên mới có quyền truy cập vai trò này.');
            return;
          }
          setCurrentUser(user);
          addToast(
            'success',
            `Đã chuyển sang tài khoản ${user.name} (${
              user.role === 'admin'
                ? '🛡️ Quản trị viên Admin'
                : user.role === 'leader'
                ? '👑 Quản lý Leader'
                : '🧑‍💼 Thành viên'
            }).`
          );
        }}
        isDark={isDark}
        isSidebarOpen={isSidebarOpen}
        onToggleTheme={() => handleToggleTheme()}
        onToggleSidebar={() => setIsSidebarOpen(!isSidebarOpen)}
        onLogout={() => {
          setCurrentUser(null);
          setAuthToken(null);
          localStorage.removeItem('workline_token');
        }}
        onOpenProfile={() => setCurrentView('profile')}
        onGoHome={() => {
          setCurrentView('home');
          setSelectedTaskId(null);
        }}
        notifications={userNotifications}
        onReadNotification={(id) =>
          setNotifications((prev) => prev.map((n) => (n.id === id ? { ...n, read: true } : n)))
        }
        onClearNotifications={() => {
          setNotifications((prev) => prev.filter((n) => !userNotifications.some((un) => un.id === n.id)));
        }}
        onSelectTask={(tid) => {
          setSelectedTaskId(tid);
          setCurrentView('taskdetail');
        }}
      />

      <div className="flex">
        <Sidebar
          currentView={currentView}
          currentUser={currentUser}
          isOpen={isSidebarOpen}
          onSelectView={(v) => setCurrentView(v)}
          onCloseMobile={() => setIsSidebarOpen(false)}
        />

        <main className="flex-1 p-4 sm:p-6 lg:p-8 min-w-0 transition-all duration-300">
          {currentView === 'home' && (
            <HomeView
              tasks={tasks}
              currentUser={currentUser}
              allMembers={members}
              onOpenTaskDetail={(tid) => {
                setSelectedTaskId(tid);
                setCurrentView('taskdetail');
              }}
              onOpenNewTask={() => setIsTaskModalOpen(true)}
              onAcceptTask={handleAcceptTask}
              onCompleteTask={handleCompleteTask}
              onDeleteCompletedTask={handleDeleteCompletedTask}
              onDeleteExtensionHistory={handleDeleteExtensionHistory}
              onClearAllExtensionHistory={handleClearAllExtensionHistory}
              onOpenProfile={() => setCurrentView('profile')}
              onOpenExtendModal={(tid) => {
                const t = tasks.find((x) => x.id === tid);
                if (t) setExtendTask(t);
              }}
              onApproveExtension={handleApproveExtension}
              onRejectExtension={handleRejectExtension}
              onViewQuickProfile={(m) => setQuickProfileMember(m)}
            />
          )}

          {currentView === 'members' && (
            currentUser.role === 'member' ? (
              <div className="rounded-2xl border border-rose-200 bg-rose-50/60 p-8 text-center dark:border-rose-900/40 dark:bg-rose-950/20 max-w-xl mx-auto my-12 shadow-xs">
                <div className="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-rose-100 text-rose-600 dark:bg-rose-900/50 dark:text-rose-400 mb-3">
                  <ShieldAlert className="h-7 w-7" />
                </div>
                <h3 className="text-base font-bold text-slate-900 dark:text-white">Không có quyền truy cập</h3>
                <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">
                  Tài khoản Thành viên không được phép truy cập khu vực quản trị và danh sách nhân sự của hệ thống.
                </p>
                <button
                  type="button"
                  onClick={() => setCurrentView('home')}
                  className="mt-4 inline-flex items-center gap-2 rounded-xl bg-slate-900 px-4 py-2 text-xs font-bold text-white hover:bg-slate-800 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-100 cursor-pointer shadow-xs transition-colors"
                >
                  Quay lại Trang chủ
                </button>
              </div>
            ) : (
              <MembersView
                members={members}
                tasks={tasks}
                currentUser={currentUser}
                onEditMember={(m) => {
                  setEditingMember(m);
                  setIsMemberModalOpen(true);
                }}
                onAddMember={() => {
                  setEditingMember(null);
                  setIsMemberModalOpen(true);
                }}
                onDeleteMember={handleDeleteMember}
                onViewQuickProfile={(m) => setQuickProfileMember(m)}
                onResendInvite={handleResendInvite}
              />
            )
          )}

          {currentView === 'profile' && (
            <ProfileView
              currentUser={currentUser}
              isDark={isDark}
              onToggleTheme={handleToggleTheme}
              onUpdateProfile={handleUpdateProfile}
              onShowToast={addToast}
            />
          )}

          {currentView === 'taskdetail' && selectedTask && (
            <TaskDetailView
              task={selectedTask}
              allMembers={members}
              currentUser={currentUser}
              onBack={() => setCurrentView('home')}
              onAccept={handleAcceptTask}
              onComplete={handleCompleteTask}
              onReopen={handleReopenTask}
              onDelete={handleDeleteTask}
              onDeleteCompletedTask={handleDeleteCompletedTask}
              onAddComment={handleAddComment}
              onAddAssignee={handleAddAssignee}
              onRemoveAssignee={handleRemoveAssignee}
              onRequestExtend={(tid) => {
                const t = tasks.find((x) => x.id === tid);
                if (t) setExtendTask(t);
              }}
              onViewQuickProfile={(m) => setQuickProfileMember(m)}
            />
          )}
        </main>
      </div>

      {/* Personnel Edit/Add Modal - The central highlight */}
      <MemberModal
        isOpen={isMemberModalOpen}
        onClose={() => setIsMemberModalOpen(false)}
        member={editingMember}
        allMembers={members}
        allTasks={tasks}
        currentUser={currentUser}
        onSave={handleSaveMember}
      />

      {/* Quick Profile Modal */}
      <QuickProfileModal
        member={quickProfileMember}
        tasks={tasks}
        currentUser={currentUser}
        onClose={() => setQuickProfileMember(null)}
        onEdit={(m) => {
          setEditingMember(m);
          setIsMemberModalOpen(true);
        }}
      />

      {/* Create Task Modal */}
      <TaskModal
        isOpen={isTaskModalOpen}
        onClose={() => setIsTaskModalOpen(false)}
        currentUser={currentUser}
        allMembers={members}
        onSave={handleSaveTask}
      />

      {/* Extend Deadline Modal */}
      <ExtendModal
        task={extendTask}
        currentUser={currentUser}
        onClose={() => setExtendTask(null)}
        onConfirmExtend={handleConfirmExtend}
      />

      {/* Toast Notifications Stack */}
      <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
        {toasts.map((toast) => (
          <div
            key={toast.id}
            className={`pointer-events-auto flex items-center gap-3 rounded-2xl px-4 py-3 text-xs font-bold text-white shadow-xl transition-all animate-in slide-in-from-bottom-5 ${
              toast.type === 'success'
                ? 'bg-slate-900 border border-slate-700/60 dark:bg-slate-800'
                : toast.type === 'error'
                ? 'bg-rose-600'
                : 'bg-blue-600'
            }`}
          >
            {toast.type === 'success' && <CheckCircle2 className="h-4 w-4 text-teal-400" />}
            {toast.type === 'error' && <AlertCircle className="h-4 w-4 text-white" />}
            {toast.type === 'info' && <Info className="h-4 w-4 text-white" />}
            <span>{toast.message}</span>
            <button
              type="button"
              onClick={() => setToasts((prev) => prev.filter((t) => t.id !== toast.id))}
              className="ml-1 text-slate-400 hover:text-white"
            >
              <X className="h-3.5 w-3.5" />
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}


// ==== entry point (from main.tsx) ====
const rootEl = document.getElementById('root');
const root = window.ReactDOM.createRoot(rootEl);
root.render(
  React.createElement(StrictMode, null, React.createElement(App))
);

</script>

<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>

<script type="module">
  import React from "react";
  import ReactDOM from "react-dom";
  import * as ReactDOMClient from "react-dom/client";
  import * as LucideIcons from "lucide-react";

  window.React = React;
  window.ReactDOM = Object.assign({}, ReactDOM, ReactDOMClient);
  window.LucideIcons = LucideIcons;

  const source = document.getElementById('app-source').textContent;
  const compiled = Babel.transform(source, {
    presets: ["react", "typescript"],
    filename: "app.tsx"
  }).code;

  try {
    (0, eval)(compiled);
  } catch (err) {
    console.error(err);
    document.getElementById('root').innerHTML =
      '<div style="padding:2rem;font-family:sans-serif;color:#b91c1c">' +
      '<h2>Lỗi khi tải ứng dụng</h2><pre style="white-space:pre-wrap">' +
      String(err && err.stack || err) + '</pre></div>';
  }
</script>
</body>
</html>
